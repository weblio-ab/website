name: Deploy Application
on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development
    types: [closed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'development'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/master' && 'production' || 'staging') }}
    
    env:
      ENVIRONMENT_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/master' && 'production' || 'staging') }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ vars.PNPM_VERSION || '10' }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ vars.NODE_VERSION || 'latest' }}
        cache: 'pnpm'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@weblio-ab'
    
    - name: Install dependencies
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ${{ vars.INSTALL_COMMAND || 'pnpm install' }}
      
    - name: Build frontend
      env:
        VITE_ENVIRONMENT: ${{ env.ENVIRONMENT_NAME }}
        VITE_FORM_PROXY_URL: ${{ vars.VITE_FORM_PROXY_URL }}
        VITE_FORM_PROXY_ID: ${{ vars.VITE_FORM_PROXY_ID }}
        VITE_FORM_PROXY_RECAPTCHA_REQUIRED: ${{ vars.VITE_FORM_PROXY_RECAPTCHA_REQUIRED }}
        VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      run: ${{ vars.BUILD_COMMAND || 'pnpm run build' }}
        
    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        server: ${{ vars.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ vars.BUILD_DIR || './dist/' }}
        server-dir: ${{ vars.DEPLOY_PATH }}
          
    - name: Deployment notification
      run: |
        echo "✅ Application successfully deployed to ${{ env.ENVIRONMENT_NAME }} environment"
        echo "📁 Deployed to: ${{ vars.DEPLOY_PATH }}"
        echo "🎯 Frontend: Static files deployed to root"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "🚀 Manual deployment triggered"
          echo "📋 Branch: ${{ github.event.inputs.branch }}"
          echo "🎯 Environment: ${{ github.event.inputs.environment }}"
        fi
